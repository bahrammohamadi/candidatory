# Independent scheduled Telegram -> Instagram intake, deploy with:
# npx wrangler deploy --config wrangler.instagram.toml
name = "candidatory-instagram-staging"
main = "cloudflare-instagram-sidecar.mjs"
compatibility_date = "2026-10-01"
workers_dev = true

[triggers]
crons = ["*/30 * * * *"]

[[d1_databases]]
binding = "NEWS_DB"
database_name = "candidatory-news"
database_id = "5f5e3a65-ed02-4c5a-bbf3-472eac9edd7f"
